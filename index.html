<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひより日記</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Literata:ital,wght@0,400;0,500;1,400&display=swap');

:root {
  --bg: #f2e9db;
  --frame-bg: #fbf3e7;
  --surface: #ffffff;
  --surface-2: #fffaf3;
  --text: #3d2e22;
  --text-muted: #9c8674;
  --placeholder: #c2ab97;
  --accent: #f2765a;
  --accent-ink: #ffffff;
  --accent-soft: #ffe1d6;
  --border: #ede1d3;
  --shadow-color: 30, 20, 10;

  --mood-happy: #ffe5ad;
  --mood-calm: #cfe6d7;
  --mood-excited: #ffd0c2;
  --mood-sad: #d3ddf0;
  --mood-angry: #f2d2d2;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171009;
    --frame-bg: #241a12;
    --surface: #2e2118;
    --surface-2: #362619;
    --text: #f5e9dd;
    --text-muted: #b9a692;
    --placeholder: #7d6a58;
    --accent: #ff9b76;
    --accent-ink: #241005;
    --accent-soft: #4a2e22;
    --border: #3d2c21;
    --shadow-color: 0, 0, 0;

    --mood-happy: #5c4a26;
    --mood-calm: #2c4234;
    --mood-excited: #5a3327;
    --mood-sad: #2c3550;
    --mood-angry: #4a2b2b;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #171009;
  --frame-bg: #241a12;
  --surface: #2e2118;
  --surface-2: #362619;
  --text: #f5e9dd;
  --text-muted: #b9a692;
  --placeholder: #7d6a58;
  --accent: #ff9b76;
  --accent-ink: #241005;
  --accent-soft: #4a2e22;
  --border: #3d2c21;
  --shadow-color: 0, 0, 0;

  --mood-happy: #5c4a26;
  --mood-calm: #2c4234;
  --mood-excited: #5a3327;
  --mood-sad: #2c3550;
  --mood-angry: #4a2b2b;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 16px;
}

.phone {
  width: 100%;
  max-width: 412px;
  min-height: 812px;
  background: var(--frame-bg);
  border-radius: 32px;
  box-shadow: 0 24px 60px -20px rgba(var(--shadow-color), 0.35), 0 2px 0 rgba(var(--shadow-color), 0.04);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.view { display: none; flex-direction: column; flex: 1; min-height: 812px; }
.view.active { display: flex; }

/* ---------- Header ---------- */
.status-spacer { height: 28px; flex-shrink: 0; }

.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 20px 18px;
  gap: 12px;
}

.app-title {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 30px;
  letter-spacing: -0.02em;
  margin: 0;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: var(--surface);
  color: var(--text);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
.icon-btn:hover { transform: translateY(-1px); }
.icon-btn:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.icon-btn.plain { background: transparent; font-size: 22px; }
.icon-row { display: flex; gap: 10px; }

.header-title {
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 17px;
}

.text-btn {
  border: none;
  background: none;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 15px;
  color: var(--accent);
  cursor: pointer;
  padding: 10px 4px;
}
.text-btn:disabled { color: var(--placeholder); cursor: not-allowed; }
.text-btn.danger { color: #c65b4a; }

/* ---------- List view ---------- */
.entry-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 20px 110px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-muted);
  padding: 40px 20px;
  font-family: 'Literata', serif;
}
.empty-state .glyph { font-size: 40px; margin-bottom: 10px; }

.entry-card {
  background: var(--surface);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  gap: 14px;
  align-items: center;
  text-align: left;
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 16px -8px rgba(var(--shadow-color), 0.18);
  font-family: inherit;
  color: inherit;
  width: 100%;
}

.mood-badge {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.entry-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.entry-date-row {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.entry-title {
  font-family: 'Literata', serif;
  font-weight: 500;
  font-size: 16px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.entry-preview {
  font-family: 'Literata', serif;
  font-size: 13.5px;
  color: var(--text-muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.4;
}

.entry-photo {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
}

.fab {
  position: absolute;
  right: 20px;
  bottom: 34px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 10px 24px -6px rgba(242, 118, 90, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease;
}
.fab:hover { transform: scale(1.05); }

/* ---------- Editor / Detail shared ---------- */
.editor-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.field-date {
  font-size: 14px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.mood-select-label {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 8px;
  display: block;
}

.mood-row { display: flex; gap: 8px; justify-content: space-between; }

.mood-chip {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.15s ease;
}
.mood-chip:hover { transform: translateY(-1px); }
.mood-chip.selected { border-color: var(--accent); }

.field-input {
  width: 100%;
  background: var(--surface);
  border: none;
  border-radius: 14px;
  padding: 14px 16px;
  font-family: 'Literata', serif;
  color: var(--text);
  resize: none;
}
.field-input::placeholder { color: var(--placeholder); font-family: 'Literata', serif; }
.title-input { font-size: 17px; font-weight: 500; }
.body-input { font-size: 15px; line-height: 1.7; flex: 1; min-height: 220px; }

.photo-row { display: flex; align-items: center; gap: 10px; }
.photo-add-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.photo-preview-wrap { position: relative; }
.photo-preview { width: 68px; height: 68px; border-radius: 12px; object-fit: cover; display: block; }
.photo-remove {
  position: absolute; top: -6px; right: -6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--text); color: var(--frame-bg);
  border: none; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.bottom-bar { padding: 12px 20px 30px; }
.save-btn {
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  border: none;
  background: var(--accent);
  color: var(--accent-ink);
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
}
.save-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

/* ---------- Detail view ---------- */
.detail-body { flex: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.detail-mood-row { display: flex; align-items: center; gap: 12px; }
.detail-mood-badge { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.detail-date { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.detail-title { font-family: 'Literata', serif; font-weight: 500; font-size: 22px; margin: 0; text-wrap: balance; }
.detail-photo { width: 100%; border-radius: 16px; object-fit: cover; max-height: 220px; }
.detail-text { font-family: 'Literata', serif; font-size: 16px; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
.detail-actions { display: flex; gap: 10px; padding: 12px 20px 30px; }
.detail-actions .text-btn.outline {
  flex: 1; border: 1px solid var(--border); border-radius: 14px; padding: 13px; background: var(--surface);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="phone">

  <!-- LIST VIEW -->
  <section class="view active" id="view-list">
    <div class="status-spacer"></div>
    <div class="top-row">
      <h1 class="app-title">ひより日記</h1>
      <div class="icon-row">
        <button class="icon-btn" id="btn-theme" title="テーマ切り替え" aria-label="テーマ切り替え">🌙</button>
      </div>
    </div>
    <div class="entry-list" id="entry-list"></div>
    <button class="fab" id="btn-add" aria-label="新しい日記を書く">+</button>
  </section>

  <!-- EDITOR VIEW -->
  <section class="view" id="view-editor">
    <div class="status-spacer"></div>
    <div class="top-row">
      <button class="icon-btn plain" id="btn-editor-back" aria-label="戻る">←</button>
      <span class="header-title" id="editor-heading">新しい日記</span>
      <button class="text-btn" id="btn-save">保存</button>
    </div>
    <div class="editor-body">
      <div class="field-date" id="editor-date"></div>
      <div>
        <span class="mood-select-label">今日の気分は？</span>
        <div class="mood-row" id="mood-row"></div>
      </div>
      <input class="field-input title-input" id="input-title" placeholder="タイトルを入力" maxlength="60" />
      <textarea class="field-input body-input" id="input-body" placeholder="今日はどんな一日でしたか？&#10;感じたこと、あったことを自由に書いてみましょう。"></textarea>
      <div class="photo-row" id="photo-row">
        <button class="photo-add-btn" id="btn-photo">📷 写真を追加</button>
        <input type="file" accept="image/*" id="input-photo" hidden />
      </div>
    </div>
  </section>

  <!-- DETAIL VIEW -->
  <section class="view" id="view-detail">
    <div class="status-spacer"></div>
    <div class="top-row">
      <button class="icon-btn plain" id="btn-detail-back" aria-label="戻る">←</button>
      <span class="header-title">日記</span>
      <button class="icon-btn plain" id="btn-detail-edit" aria-label="編集">✎</button>
    </div>
    <div class="detail-body">
      <div class="detail-mood-row">
        <div class="detail-mood-badge" id="detail-mood-badge"></div>
        <div class="detail-date" id="detail-date"></div>
      </div>
      <h2 class="detail-title" id="detail-title"></h2>
      <img class="detail-photo" id="detail-photo" alt="" hidden />
      <p class="detail-text" id="detail-text"></p>
    </div>
    <div class="detail-actions">
      <button class="text-btn outline danger" id="btn-delete">削除する</button>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "hiyori-diary-entries";
  var THEME_KEY = "hiyori-diary-theme";

  var MOODS = [
    { id: "happy",   emoji: "😊", bgVar: "--mood-happy" },
    { id: "calm",    emoji: "😌", bgVar: "--mood-calm" },
    { id: "excited", emoji: "🎉", bgVar: "--mood-excited" },
    { id: "sad",     emoji: "😢", bgVar: "--mood-sad" },
    { id: "angry",   emoji: "😡", bgVar: "--mood-angry" }
  ];
  var WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

  function moodById(id) {
    for (var i = 0; i < MOODS.length; i++) if (MOODS[i].id === id) return MOODS[i];
    return MOODS[0];
  }

  function formatDate(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WEEKDAYS[d.getDay()] + "）";
  }
  function formatDateShort(iso) {
    var d = new Date(iso + "T00:00:00");
    return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WEEKDAYS[d.getDay()] + "）";
  }
  function todayIso() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function loadEntries() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function saveEntries(entries) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch (e) {}
  }

  function seedEntries() {
    var d = new Date();
    function offset(days) {
      var x = new Date(d);
      x.setDate(x.getDate() - days);
      return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
    }
    return [
      { id: "seed-1", date: offset(0), mood: "happy", title: "特別な一日（サンプル）", body: "友人とカフェで長い時間おしゃべりした。久しぶりに心が軽くなった。\n\nこれはサンプルの日記です。右下の + から自分の日記を書いてみましょう。", photo: null, createdAt: Date.now() - 0 },
      { id: "seed-2", date: offset(1), mood: "calm", title: "静かな夜（サンプル）", body: "本を読みながらゆっくり過ごした一日。", photo: null, createdAt: Date.now() - 1000 },
      { id: "seed-3", date: offset(3), mood: "sad", title: "疲れた一日（サンプル）", body: "仕事が忙しくて少し落ち込んだ。早く寝よう。", photo: null, createdAt: Date.now() - 2000 }
    ];
  }

  var entries = loadEntries();
  if (entries === null) {
    entries = seedEntries();
    saveEntries(entries);
  }

  var state = { editingId: null, viewingId: null, draftMood: "happy", draftPhoto: null };

  var els = {
    list: document.getElementById("entry-list"),
    viewList: document.getElementById("view-list"),
    viewEditor: document.getElementById("view-editor"),
    viewDetail: document.getElementById("view-detail"),
    editorHeading: document.getElementById("editor-heading"),
    editorDate: document.getElementById("editor-date"),
    moodRow: document.getElementById("mood-row"),
    inputTitle: document.getElementById("input-title"),
    inputBody: document.getElementById("input-body"),
    inputPhoto: document.getElementById("input-photo"),
    btnPhoto: document.getElementById("btn-photo"),
    photoRow: document.getElementById("photo-row"),
    btnSave: document.getElementById("btn-save"),
    detailMoodBadge: document.getElementById("detail-mood-badge"),
    detailDate: document.getElementById("detail-date"),
    detailTitle: document.getElementById("detail-title"),
    detailPhoto: document.getElementById("detail-photo"),
    detailText: document.getElementById("detail-text"),
    btnTheme: document.getElementById("btn-theme")
  };

  function showView(name) {
    [els.viewList, els.viewEditor, els.viewDetail].forEach(function (v) { v.classList.remove("active"); });
    if (name === "list") els.viewList.classList.add("active");
    if (name === "editor") els.viewEditor.classList.add("active");
    if (name === "detail") els.viewDetail.classList.add("active");
  }

  function renderList() {
    var sorted = entries.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.createdAt - a.createdAt;
    });
    els.list.innerHTML = "";
    if (sorted.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<div class="glyph">🖋️</div>今日の出来事を書いてみましょう';
      els.list.appendChild(empty);
      return;
    }
    sorted.forEach(function (entry) {
      var mood = moodById(entry.mood);
      var card = document.createElement("button");
      card.className = "entry-card";
      card.type = "button";
      card.addEventListener("click", function () { openDetail(entry.id); });

      var badge = document.createElement("div");
      badge.className = "mood-badge";
      badge.style.background = "var(" + mood.bgVar + ")";
      badge.textContent = mood.emoji;

      var body = document.createElement("div");
      body.className = "entry-card-body";
      var dateRow = document.createElement("div");
      dateRow.className = "entry-date-row";
      dateRow.textContent = formatDateShort(entry.date);
      var title = document.createElement("div");
      title.className = "entry-title";
      title.textContent = entry.title || "(無題)";
      var preview = document.createElement("div");
      preview.className = "entry-preview";
      preview.textContent = entry.body || "";
      body.appendChild(dateRow);
      body.appendChild(title);
      body.appendChild(preview);

      card.appendChild(badge);
      card.appendChild(body);

      if (entry.photo) {
        var img = document.createElement("img");
        img.className = "entry-photo";
        img.src = entry.photo;
        img.alt = "";
        card.appendChild(img);
      }

      els.list.appendChild(card);
    });
  }

  function renderMoodRow() {
    els.moodRow.innerHTML = "";
    MOODS.forEach(function (mood) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "mood-chip" + (state.draftMood === mood.id ? " selected" : "");
      chip.style.background = "var(" + mood.bgVar + ")";
      chip.textContent = mood.emoji;
      chip.setAttribute("aria-label", mood.id);
      chip.addEventListener("click", function () {
        state.draftMood = mood.id;
        renderMoodRow();
      });
      els.moodRow.appendChild(chip);
    });
  }

  function updateSaveEnabled() {
    var has = els.inputTitle.value.trim().length > 0 || els.inputBody.value.trim().length > 0;
    els.btnSave.disabled = !has;
  }

  function renderPhotoRow() {
    els.photoRow.innerHTML = "";
    if (state.draftPhoto) {
      var wrap = document.createElement("div");
      wrap.className = "photo-preview-wrap";
      var img = document.createElement("img");
      img.className = "photo-preview";
      img.src = state.draftPhoto;
      img.alt = "";
      var remove = document.createElement("button");
      remove.className = "photo-remove";
      remove.type = "button";
      remove.textContent = "✕";
      remove.setAttribute("aria-label", "写真を削除");
      remove.addEventListener("click", function () {
        state.draftPhoto = null;
        renderPhotoRow();
      });
      wrap.appendChild(img);
      wrap.appendChild(remove);
      els.photoRow.appendChild(wrap);
    } else {
      var btn = document.createElement("button");
      btn.className = "photo-add-btn";
      btn.type = "button";
      btn.id = "btn-photo";
      btn.textContent = "📷 写真を追加";
      btn.addEventListener("click", function () { els.inputPhoto.click(); });
      els.photoRow.appendChild(btn);
    }
  }

  function openEditor(entryId) {
    state.editingId = entryId || null;
    var entry = entryId ? entries.find(function (e) { return e.id === entryId; }) : null;
    els.editorHeading.textContent = entry ? "日記を編集" : "新しい日記";
    els.editorDate.textContent = formatDate(entry ? entry.date : todayIso());
    els.editorDate.dataset.iso = entry ? entry.date : todayIso();
    state.draftMood = entry ? entry.mood : "happy";
    state.draftPhoto = entry ? entry.photo : null;
    els.inputTitle.value = entry ? entry.title : "";
    els.inputBody.value = entry ? entry.body : "";
    renderMoodRow();
    renderPhotoRow();
    updateSaveEnabled();
    showView("editor");
  }

  function openDetail(entryId) {
    var entry = entries.find(function (e) { return e.id === entryId; });
    if (!entry) return;
    state.viewingId = entryId;
    var mood = moodById(entry.mood);
    els.detailMoodBadge.style.background = "var(" + mood.bgVar + ")";
    els.detailMoodBadge.textContent = mood.emoji;
    els.detailDate.textContent = formatDate(entry.date);
    els.detailTitle.textContent = entry.title || "(無題)";
    els.detailText.textContent = entry.body || "";
    if (entry.photo) {
      els.detailPhoto.src = entry.photo;
      els.detailPhoto.hidden = false;
    } else {
      els.detailPhoto.hidden = true;
    }
    showView("detail");
  }

  function saveDraft() {
    var title = els.inputTitle.value.trim();
    var body = els.inputBody.value.trim();
    if (!title && !body) return;
    if (state.editingId) {
      var entry = entries.find(function (e) { return e.id === state.editingId; });
      entry.title = title;
      entry.body = body;
      entry.mood = state.draftMood;
      entry.photo = state.draftPhoto;
    } else {
      entries.push({
        id: "e-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
        date: els.editorDate.dataset.iso || todayIso(),
        mood: state.draftMood,
        title: title,
        body: body,
        photo: state.draftPhoto,
        createdAt: Date.now()
      });
    }
    saveEntries(entries);
    renderList();
    showView("list");
  }

  function deleteEntry(entryId) {
    entries = entries.filter(function (e) { return e.id !== entryId; });
    saveEntries(entries);
    renderList();
    showView("list");
  }

  // ---- theme toggle ----
  function applyTheme(mode) {
    var root = document.documentElement;
    if (mode === "dark") { root.setAttribute("data-theme", "dark"); els.btnTheme.textContent = "☀️"; }
    else if (mode === "light") { root.setAttribute("data-theme", "light"); els.btnTheme.textContent = "🌙"; }
    else { root.removeAttribute("data-theme"); els.btnTheme.textContent = "🌓"; }
  }
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved || "system");
  }
  els.btnTheme.addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme") || "system";
    var next = current === "system" ? "dark" : current === "dark" ? "light" : "system";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  });

  // ---- wiring ----
  document.getElementById("btn-add").addEventListener("click", function () { openEditor(null); });
  document.getElementById("btn-editor-back").addEventListener("click", function () { showView("list"); });
  document.getElementById("btn-detail-back").addEventListener("click", function () { showView("list"); });
  document.getElementById("btn-detail-edit").addEventListener("click", function () { openEditor(state.viewingId); });
  document.getElementById("btn-delete").addEventListener("click", function () {
    if (window.confirm("この日記を削除しますか？この操作は取り消せません。")) {
      deleteEntry(state.viewingId);
    }
  });
  els.btnSave.addEventListener("click", saveDraft);
  els.inputTitle.addEventListener("input", updateSaveEnabled);
  els.inputBody.addEventListener("input", updateSaveEnabled);
  els.inputPhoto.addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      state.draftPhoto = reader.result;
      renderPhotoRow();
    };
    reader.readAsDataURL(file);
  });

  initTheme();
  renderList();
})();
</script>
</body>
</html>
